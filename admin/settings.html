<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyBurger Admin -- Settings</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/reset.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/layout-admin.css" />
  <link rel="stylesheet" href="/assets/css/pages/admin-settings.css" />

  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin/auth.js"></script>
  <script>
    if (window.MyBurger && window.MyBurger.admin && window.MyBurger.admin.auth) {
      window.MyBurger.admin.auth.guard();
    }
  </script>
</head>
<body>
  <div class="a-shell">
    <div data-slot="a-sidebar"></div>
    <div class="a-main">
      <div data-slot="a-topbar"></div>
      <div class="a-content">

        <nav class="a-set__tabs" aria-label="Settings sections">
          <button type="button" class="pill is-active" data-set-tab="site">Site</button>
          <button type="button" class="pill" data-set-tab="payment">Payment Gateway</button>
          <button type="button" class="pill" data-set-tab="hours">Hours</button>
          <button type="button" class="pill" data-set-tab="notifications">Notifications</button>
        </nav>

        <form class="a-set__panel" id="settings-form" data-set-panel novalidate>
          <!-- Panels injected by settings.js -->
        </form>

        <footer class="a-set__footer">
          <button type="button" class="btn btn--ghost" data-set-cancel>Cancel</button>
          <button type="submit" form="settings-form" class="btn btn--primary" data-set-save>Save</button>
        </footer>
      </div>
    </div>
    <div data-slot="a-bottomnav"></div>
  </div>

  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin/nav.js"></script>
  <script src="/assets/js/admin/settings.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.MyBurger && window.MyBurger.api && window.MyBurger.api.hydrate) {
        window.MyBurger.api.hydrate();
      }
      var nav = window.MyBurger && window.MyBurger.admin && window.MyBurger.admin.nav;
      if (nav) {
        nav.renderSidebar('settings');
        nav.renderTopbar({ title: 'Settings' });
        nav.renderBottomNav('settings');
      }
      if (window.MyBurger && window.MyBurger.admin && window.MyBurger.admin.settings) {
        window.MyBurger.admin.settings.render();
      }
    });
  </script>
</body>
</html>
