<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF6F0" />
  <title>MyBurger Admin -- Orders</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/reset.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/layout-admin.css" />
  <link rel="stylesheet" href="/assets/css/pages/admin-orders.css" />

  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin/auth.js"></script>
  <script>
    if (window.MyBurger && window.MyBurger.admin && window.MyBurger.admin.auth) {
      window.MyBurger.admin.auth.guard();
    }
  </script>
</head>
<body>
  <div class="a-shell">
    <div data-slot="a-sidebar"></div>
    <div class="a-main">
      <div data-slot="a-topbar"></div>
      <div class="a-content">

        <!-- KPI strip -->
        <section class="a-orders__kpis" data-kpis></section>

        <!-- Mobile status tabs -->
        <nav class="a-orders__tabs" aria-label="Order status">
          <button type="button" class="pill is-active" data-status-tab="NEW">NEW</button>
          <button type="button" class="pill" data-status-tab="PREPARING">PREP</button>
          <button type="button" class="pill" data-status-tab="READY">READY</button>
          <button type="button" class="pill" data-status-tab="DONE">DONE</button>
        </nav>

        <!-- Desktop Kanban -->
        <section class="a-orders__kanban" aria-label="Order columns">
          <div class="a-orders__col" data-col="NEW">
            <header class="a-orders__col-head"><h2>NEW</h2><span data-count>0</span></header>
            <div class="a-orders__col-body" data-col-body="NEW"></div>
          </div>
          <div class="a-orders__col" data-col="PREPARING">
            <header class="a-orders__col-head"><h2>PREPARING</h2><span data-count>0</span></header>
            <div class="a-orders__col-body" data-col-body="PREPARING"></div>
          </div>
          <div class="a-orders__col" data-col="READY">
            <header class="a-orders__col-head"><h2>READY</h2><span data-count>0</span></header>
            <div class="a-orders__col-body" data-col-body="READY"></div>
          </div>
          <div class="a-orders__col" data-col="DONE">
            <header class="a-orders__col-head"><h2>DONE</h2><span data-count>0</span></header>
            <div class="a-orders__col-body" data-col-body="DONE"></div>
          </div>
        </section>
      </div>
    </div>

    <div data-slot="a-bottomnav"></div>
  </div>

  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin/nav.js"></script>
  <script src="/assets/js/admin/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.MyBurger && window.MyBurger.api && window.MyBurger.api.hydrate) {
        window.MyBurger.api.hydrate();
      }
      var nav = window.MyBurger && window.MyBurger.admin && window.MyBurger.admin.nav;
      if (nav) {
        nav.renderSidebar('orders');
        nav.renderTopbar({ title: 'Orders' });
        nav.renderBottomNav('orders');
      }
      if (window.MyBurger && window.MyBurger.admin && window.MyBurger.admin.orders) {
        window.MyBurger.admin.orders.render();
      }
    });
  </script>
</body>
</html>
